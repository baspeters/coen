# Every agent of app.example.com uses this same file and certificate
# (shared.crt); start as many as you need, on as many hosts.
edge:
  address: edge.example.com:2636
  ca:   /etc/coen/pki/ca.crt
  cert: /etc/coen/pki/shared.crt
  key:  /etc/coen/pki/shared.key
routes:
  - host: app.example.com
    service: 127.0.0.1:8080
admin:
  socket: /run/coen/agent.sock   # for `coen status` and `coen doctor`
