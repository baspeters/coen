# Minimal Prometheus scrape config for one edge and one agent on the same host.
# On separate hosts, keep only the local job in each host's Prometheus (or point
# one Prometheus at private addresses), because the endpoint has no authentication.
scrape_configs:
  - job_name: coen-edge
    static_configs:
      - targets: ["127.0.0.1:9464"]
  - job_name: coen-agent
    static_configs:
      - targets: ["127.0.0.1:9465"]
