# Minimal Prometheus scrape config for one edge and one agent. Run Prometheus on
# the same host as each daemon (or point it at a private address), because the
# metrics endpoint has no authentication.
scrape_configs:
  - job_name: coen-edge
    static_configs:
      - targets: ["127.0.0.1:9464"]
  - job_name: coen-agent
    static_configs:
      - targets: ["127.0.0.1:9465"]
