# Put this map in the http { } context (enables clean WebSocket upgrades):
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Inside your server { } vhost (nginx owns :443 and the certificate):
location / {
    proxy_pass http://127.0.0.1:8000;   # coen edge in proxied mode
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Optional HTTP/3 for clients (nginx 1.25 or newer), in the same server { }:
#   listen 443 quic reuseport;
#   http3 on;
#   add_header Alt-Svc 'h3=":443"; ma=86400';
# nginx still forwards to the edge over HTTP/1.1; leave ingress.http3 unset on the edge,
# and keep hosts that need TCP (Windows sign-in) out of nginx's HTTP/3.
